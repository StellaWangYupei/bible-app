<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>God's Words — Bible Verse</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Georgia', serif; background: #f9f6f1; color: #2c2318; min-height: 100vh; }
.app { max-width: 560px; margin: 0 auto; padding: 1.25rem 1rem 4rem; min-height: 100vh; }
.header { text-align: center; padding-bottom: 1.25rem; border-bottom: 1px solid #e5ddd0; margin-bottom: 1.25rem; }
.header-title { font-size: 1.55rem; font-weight: 400; color: #2c2318; letter-spacing: 0.02em; margin-bottom: 0.15rem; }
.header-sub { font-size: 0.7rem; color: #9a8e80; letter-spacing: 0.15em; text-transform: uppercase; font-family: system-ui, sans-serif; }
.nav { display: flex; background: #eee8df; border-radius: 8px; padding: 3px; margin-bottom: 1.25rem; gap: 2px; }
.nav-btn { flex: 1; padding: 0.55rem; border: none; background: transparent; font-family: system-ui, sans-serif; font-size: 0.8rem; color: #9a8e80; cursor: pointer; border-radius: 6px; font-weight: 400; transition: all 0.18s; }
.nav-btn.active { background: #fff; color: #2c2318; font-weight: 500; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.card { background: #fff; border-radius: 12px; padding: 1.75rem 1.5rem; margin-bottom: 1rem; box-shadow: 0 2px 12px rgba(44,35,24,0.07); border: 1px solid #e5ddd0; min-height: 200px; display: flex; flex-direction: column; justify-content: center; transition: opacity 0.25s; }
.card.fading { opacity: 0.2; }
.verse-ref { font-family: system-ui, sans-serif; font-size: 0.7rem; font-weight: 600; color: #9a6b3a; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 0.9rem; }
.verse-text { font-size: 1.15rem; line-height: 1.85; font-style: italic; color: #2c2318; }
.hr { height: 1px; background: #ede6db; border: none; margin: 1.2rem 0; }
.section-label { font-family: system-ui, sans-serif; font-size: 0.65rem; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: #9a6b3a; margin-bottom: 0.4rem; }
.reflection-text { font-family: system-ui, sans-serif; font-size: 0.88rem; line-height: 1.7; color: #5a4f42; margin-bottom: 1rem; }
.prayer-text { font-family: system-ui, sans-serif; font-size: 0.88rem; line-height: 1.7; color: #5a4f42; font-style: italic; }
.reflection-loading { font-family: system-ui, sans-serif; font-size: 0.85rem; color: #b0a898; font-style: italic; text-align: center; padding: 1rem 0; }
.status-center { text-align: center; color: #9a8e80; font-family: system-ui, sans-serif; font-size: 0.9rem; font-style: italic; padding: 2rem 0; }
.error-msg { text-align: center; color: #c0795a; font-family: system-ui, sans-serif; font-size: 0.85rem; padding: 2rem 0; line-height: 1.7; }
.actions { display: flex; gap: 0.6rem; margin-bottom: 0.75rem; }
.btn-primary { flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.45rem; padding: 0.72rem 1rem; border-radius: 8px; font-family: system-ui, sans-serif; font-size: 0.83rem; cursor: pointer; font-weight: 500; border: none; background: #2c2318; color: #f9f6f1; transition: background 0.18s; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.45rem; padding: 0.72rem 1rem; border-radius: 8px; font-family: system-ui, sans-serif; font-size: 0.83rem; cursor: pointer; font-weight: 500; border: 1px solid #e5ddd0; background: #fff; color: #2c2318; transition: all 0.18s; }
.btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-icon { display: flex; align-items: center; justify-content: center; padding: 0.72rem; border-radius: 8px; cursor: pointer; border: 1px solid #e5ddd0; background: #fff; color: #9a8e80; min-width: 42px; transition: all 0.18s; }
.btn-icon.active { border-color: #c0795a; background: #fdf0ee; color: #c0795a; }
.btn-icon:disabled { opacity: 0.5; cursor: not-allowed; }
.note { font-family: system-ui, sans-serif; font-size: 0.75rem; color: #b0a898; text-align: center; margin-top: 0.5rem; }
.search-wrap { position: relative; margin-bottom: 1rem; }
.search-input { width: 100%; padding: 0.68rem 2.4rem; border: 1px solid #e5ddd0; border-radius: 8px; font-family: system-ui, sans-serif; font-size: 0.86rem; background: #fff; color: #2c2318; outline: none; }
.search-icon { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: #9a8e80; pointer-events: none; }
.search-clear { position: absolute; right: 0.85rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: #9a8e80; cursor: pointer; }
.fav-item { background: #fff; border: 1px solid #e5ddd0; border-radius: 10px; padding: 1.1rem 1.2rem; margin-bottom: 0.6rem; display: flex; gap: 0.75rem; align-items: flex-start; }
.fav-ref { font-family: system-ui, sans-serif; font-size: 0.68rem; font-weight: 600; color: #9a6b3a; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.3rem; }
.fav-text { font-size: 0.92rem; line-height: 1.65; font-style: italic; color: #2c2318; }
.fav-actions { display: flex; flex-direction: column; gap: 0.5rem; flex-shrink: 0; }
.fav-btn { background: none; border: none; color: #c5bdb4; cursor: pointer; padding: 0.2rem; }
.empty { text-align: center; padding: 3rem 1rem; color: #9a8e80; font-family: system-ui, sans-serif; font-size: 0.88rem; line-height: 1.7; }
.empty-icon { font-size: 2rem; margin-bottom: 0.75rem; }
.toast { position: fixed; bottom: 1.75rem; left: 50%; transform: translateX(-50%); background: #2c2318; color: #f9f6f1; padding: 0.55rem 1.2rem; border-radius: 20px; font-family: system-ui, sans-serif; font-size: 0.8rem; z-index: 999; white-space: nowrap; display: none; }
.toast.show { display: block; }
.hidden { display: none; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-title">God's Words</div>
    <div class="header-sub">King James Version · Whole Bible</div>
  </div>
  <div class="nav">
    <button class="nav-btn active" id="tab-draw" onclick="showPage('draw')">Draw</button>
    <button class="nav-btn" id="tab-favs" onclick="showPage('favs')">Favorites</button>
  </div>
  <div id="page-draw">
    <div class="card" id="verse-card">
      <div class="status-center">Tap "Draw a verse" to begin 🙏</div>
    </div>
    <div class="actions">
      <button class="btn-primary" id="draw-btn" onclick="draw()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Draw a verse
      </button>
      <button class="btn-icon" id="fav-btn" onclick="toggleFav()" disabled title="Save">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </button>
      <button class="btn-icon" id="share-btn" onclick="shareVerse()" disabled title="Share">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </button>
    </div>
    <div class="actions">
      <button class="btn-secondary" id="reflect-btn" onclick="getReflection()" disabled>
        ✦ Get Reflection & Prayer
      </button>
    </div>
    <div class="note">Draws from all 66 books · Requires internet</div>
  </div>
  <div id="page-favs" class="hidden">
    <div class="search-wrap">
      <span class="search-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      <input class="search-input" id="search-input" placeholder="Search by reference or keyword…" oninput="renderFavs()">
      <button class="search-clear" onclick="clearSearch()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div id="favs-list"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const GEMINI_API_KEY = "AQ.Ab8RN6K0hlT-qJPkZemRyb2-D-Na9hkUoFFPcHQYMtBDuNwerQ";

const BOOKS = [
  ["Genesis",50],["Exodus",40],["Leviticus",27],["Numbers",36],
  ["Deuteronomy",34],["Joshua",24],["Judges",21],["Ruth",4],
  ["1 Samuel",31],["2 Samuel",24],["1 Kings",22],["2 Kings",25],
  ["1 Chronicles",29],["2 Chronicles",36],["Ezra",10],["Nehemiah",13],
  ["Esther",10],["Job",42],["Psalms",150],["Proverbs",31],
  ["Ecclesiastes",12],["Song of Solomon",8],["Isaiah",66],["Jeremiah",52],
  ["Lamentations",5],["Ezekiel",48],["Daniel",12],["Hosea",14],
  ["Joel",3],["Amos",9],["Obadiah",1],["Jonah",4],["Micah",7],
  ["Nahum",3],["Habakkuk",3],["Zephaniah",3],["Haggai",2],
  ["Zechariah",14],["Malachi",4],["Matthew",28],["Mark",16],
  ["Luke",24],["John",21],["Acts",28],["Romans",16],
  ["1 Corinthians",16],["2 Corinthians",13],["Galatians",6],
  ["Ephesians",6],["Philippians",4],["Colossians",4],
  ["1 Thessalonians",5],["2 Thessalonians",3],["1 Timothy",6],
  ["2 Timothy",4],["Titus",3],["Philemon",1],["Hebrews",13],
  ["James",5],["1 Peter",5],["2 Peter",3],["1 John",5],
  ["2 John",1],["3 John",1],["Jude",1],["Revelation",22]
];

let currentVerse = null;
let favorites = JSON.parse(localStorage.getItem("bibleapp_favs") || "[]");
let loading = false;
let reflectionLoading = false;
let toastTimer = null;

function randomRef() {
  const [book, chapters] = BOOKS[Math.floor(Math.random() * BOOKS.length)];
  const chapter = Math.floor(Math.random() * chapters) + 1;
  const verse = Math.floor(Math.random() * 20) + 1;
  return `${book} ${chapter}:${verse}`;
}

async function fetchVerse(ref) {
  const url = `https://bible-api.com/${encodeURIComponent(ref)}?translation=kjv`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("API error");
  const data = await res.json();
  if (!data.text || data.text.trim() === "") throw new Error("Empty");
  return { ref: data.reference, text: data.text.trim().replace(/\s+/g, " ") };
}

async function getReflection() {
  if (!currentVerse || reflectionLoading) return;
  reflectionLoading = true;
  const reflectBtn = document.getElementById("reflect-btn");
  reflectBtn.disabled = true;
  reflectBtn.textContent = "Generating…";
  const card = document.getElementById("verse-card");
  const existing = card.querySelector(".reflection-section");
  if (existing) existing.remove();
  const div = document.createElement("div");
  div.className = "reflection-section";
  div.innerHTML = `<hr class="hr"><div class="reflection-loading">Reflecting on this verse…</div>`;
  card.appendChild(div);
  try {
    const prompt = `You are a gentle, wise Bible teacher. Given this Bible verse:\n\n"${currentVerse.text}" — ${currentVerse.ref} (KJV)\n\nPlease provide:\n1. A short REFLECTION (2-3 sentences in plain, modern English — like explaining it to a friend)\n2. A short PRAYER (1-2 sentences, personal and heartfelt)\n\nFormat exactly like this:\nREFLECTION: [your reflection here]\nPRAYER: [your prayer here]`;
    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`,
      { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.7, maxOutputTokens: 300 } }) }
    );
    const data = await response.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
    const reflectionMatch = text.match(/REFLECTION:\s*(.+?)(?=PRAYER:|$)/s);
    const prayerMatch = text.match(/PRAYER:\s*(.+?)$/s);
    const reflection = reflectionMatch ? reflectionMatch[1].trim() : "";
    const prayer = prayerMatch ? prayerMatch[1].trim() : "";
    div.innerHTML = `<hr class="hr"><div class="section-label">Reflection</div><div class="reflection-text">${reflection}</div><div class="section-label">Prayer</div><div class="prayer-text">${prayer}</div>`;
    reflectBtn.textContent = "✦ Refresh Reflection";
  } catch(e) {
    div.innerHTML = `<hr class="hr"><div class="error-msg">Couldn't generate reflection. Please try again.</div>`;
    reflectBtn.textContent = "✦ Get Reflection & Prayer";
  }
  reflectBtn.disabled = false;
  reflectionLoading = false;
}

async function draw() {
  if (loading) return;
  loading = true;
  const card = document.getElementById("verse-card");
  const btn = document.getElementById("draw-btn");
  card.classList.add("fading");
  btn.disabled = true;
  document.getElementById("fav-btn").disabled = true;
  document.getElementById("share-btn").disabled = true;
  document.getElementById("reflect-btn").disabled = true;
  document.getElementById("reflect-btn").textContent = "✦ Get Reflection & Prayer";
  await new Promise(r => setTimeout(r, 220));
  card.innerHTML = '<div class="status-center">Drawing from the whole Bible…</div>';
  card.classList.remove("fading");
  let attempts = 0;
  while (attempts < 5) {
    try {
      const v = await fetchVerse(randomRef());
      currentVerse = v;
      renderVerse();
      loading = false;
      btn.disabled = false;
      btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Draw another verse`;
      document.getElementById("fav-btn").disabled = false;
      document.getElementById("share-btn").disabled = false;
      document.getElementById("reflect-btn").disabled = false;
      return;
    } catch { attempts++; }
  }
  card.innerHTML = '<div class="error-msg">Couldn\'t fetch a verse.<br>Please check your internet and try again.</div>';
  loading = false;
  btn.disabled = false;
}

function renderVerse() {
  if (!currentVerse) return;
  const isFav = favorites.some(f => f.ref === currentVerse.ref);
  document.getElementById("verse-card").innerHTML = `<div class="verse-ref">${currentVerse.ref}</div><div class="verse-text">"${currentVerse.text}"</div>`;
  const favBtn = document.getElementById("fav-btn");
  favBtn.className = "btn-icon" + (isFav ? " active" : "");
  favBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
}

function toggleFav() {
  if (!currentVerse) return;
  const isFav = favorites.some(f => f.ref === currentVerse.ref);
  favorites = isFav ? favorites.filter(f => f.ref !== currentVerse.ref) : [currentVerse, ...favorites];
  localStorage.setItem("bibleapp_favs", JSON.stringify(favorites));
  renderVerse();
  updateFavTab();
  showToast(isFav ? "Removed" : "Saved ♥");
}

function shareVerse() {
  if (!currentVerse) return;
  const text = `"${currentVerse.text}"\n— ${currentVerse.ref} (KJV)`;
  if (navigator.share) { navigator.share({ text }).catch(() => {}); }
  else { navigator.clipboard.writeText(text).then(() => showToast("Copied!")); }
}

function showPage(page) {
  document.getElementById("page-draw").classList.toggle("hidden", page !== "draw");
  document.getElementById("page-favs").classList.toggle("hidden", page !== "favs");
  document.getElementById("tab-draw").classList.toggle("active", page === "draw");
  document.getElementById("tab-favs").classList.toggle("active", page === "favs");
  if (page === "favs") renderFavs();
}

function renderFavs() {
  const q = document.getElementById("search-input").value.toLowerCase();
  const filtered = q ? favorites.filter(f => f.ref.toLowerCase().includes(q) || f.text.toLowerCase().includes(q)) : favorites;
  const list = document.getElementById("favs-list");
  if (favorites.length === 0) { list.innerHTML = '<div class="empty"><div class="empty-icon">✦</div>No favorites yet.<br>Draw a verse and tap the heart to save it.</div>'; return; }
  if (filtered.length === 0) { list.innerHTML = `<div class="empty">No verses match "${q}"</div>`; return; }
  list.innerHTML = filtered.map(f => `<div class="fav-item"><div style="flex:1"><div class="fav-ref">${f.ref}</div><div class="fav-text">"${f.text.length > 180 ? f.text.slice(0,180)+'…' : f.text}"</div></div><div class="fav-actions"><button class="fav-btn" onclick="shareFav('${f.ref.replace(/'/g,"\\'")}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></button><button class="fav-btn" onclick="removeFav('${f.ref.replace(/'/g,"\\'")}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div></div>`).join("");
}

function removeFav(ref) { favorites = favorites.filter(f => f.ref !== ref); localStorage.setItem("bibleapp_favs", JSON.stringify(favorites)); renderFavs(); updateFavTab(); }
function shareFav(ref) { const f = favorites.find(v => v.ref === ref); if (!f) return; const text = `"${f.text}"\n— ${f.ref} (KJV)`; if (navigator.share) { navigator.share({ text }).catch(() => {}); } else { navigator.clipboard.writeText(text).then(() => showToast("Copied!")); } }
function clearSearch() { document.getElementById("search-input").value = ""; renderFavs(); }
function updateFavTab() { document.getElementById("tab-favs").textContent = favorites.length > 0 ? `Favorites (${favorites.length})` : "Favorites"; }
function showToast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2000); }
</script>
</body>
</html>
